name: verify
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/protocol/src/generated.ts
      - run: pnpm verify
      - run: pnpm test:tools
      - run: pnpm build
      - run: cargo build --workspace
      - run: powershell -NoProfile -File tools/smoke.ps1
      - name: Smoke with UTF-8 console preamble regression
        run: powershell -NoProfile -NonInteractive -Command "[Console]::InputEncoding=[Text.Encoding]::UTF8; & './tools/smoke.ps1'"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure-evidence
          include-hidden-files: true
          path: |
            .test-artifacts/smoke-*/failure-projection.json
            .test-artifacts/smoke-*/failure-diagnostics.json
            .test-artifacts/smoke-*/pipeline-verification.json
            .test-artifacts/smoke-*/hook-*.json
  installer:
    # Builds the real NSIS installer, installs it into a temp directory, edits the user's
    # hook config, uninstalls, and checks that only our own entries were removed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # tauri.release.conf.json sets useLocalToolsDir, so the NSIS download lives here.
      # A cache miss plus a failed download fails the job on purpose; an always-green
      # installer check would not protect anything.
      - uses: actions/cache@v4
        with:
          path: target/.tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: tauri-tools-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Package
        id: package
        shell: pwsh
        run: |
          $log = pnpm package:windows
          $log | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $match = $log | Select-String '^SETUP=(.+)$' | Select-Object -Last 1
          if (-not $match) { throw 'package-windows did not report an installer path' }
          "setup=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Install, edit, uninstall
        env:
          SETUP: ${{ steps.package.outputs.setup }}
        run: powershell -NoProfile -File tools/test-installer.ps1 -Setup $env:SETUP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: .test-artifacts/install-*/result.json
  desktop-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/desktop install --frozen-lockfile
      - name: Record desktop runner environment
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          [pscustomobject]@{
            runnerOS = $env:RUNNER_OS
            imageOS = $env:ImageOS
            elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          } | ConvertTo-Json -Compress
      - run: pnpm test:ui
      - name: System reduced-motion acceptance
        run: pnpm test:ui --skip-build --system-reduced-motion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .test-artifacts/ui-*/functional-results.json
            .test-artifacts/ui-*/visual-results.json
            .test-artifacts/ui-*/cold-start-results.json
            .test-artifacts/ui-*/render-latencies.json
            .test-artifacts/ui-*/acceptance.json
            .test-artifacts/ui-*/system-motion-results.json
            .test-artifacts/ui-*/thinking-*-wake.json
            .test-artifacts/ui-*/attention-*-notification-entry.json
            .test-artifacts/ui-*/failure-*.json
            .test-artifacts/ui-*/hook-*.json
            .test-artifacts/ui-*/logs/**
            .test-artifacts/ui-*/*.png
