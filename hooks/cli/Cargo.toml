[package]
name = "code-musume-hook"
version = "0.1.2"
edition = "2021"
description = "代码娘 hook CLI（哑管道）——永远 exit 0、不写 stdout、不做决策"

[[bin]]
name = "code-musume-hook"
path = "src/main.rs"

[features]
# 只放宽投递预算上限，供桌面 e2e 在负载更高的 CI 上使用；生产构建不含此 feature。
e2e = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
code-musume-contracts = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
ureq = { version = "3.4", default-features = false }
toml_edit = { version = "0.25", features = ["serde"] }
base64 = "0.22"
