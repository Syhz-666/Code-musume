[package]
name = "pet"
version = "0.1.0"
edition = "2021"
description = "代码娘桌宠应用（M1 骨架）"

[lib]
name = "pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 钉在 2.12.x：with_webview 的 webview2-com 依赖会随 tauri minor 版本变动（P13）
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
code-musume-contracts = { workspace = true }
code-musume-core = { workspace = true }
code-musume-hook = { path = "../../../hooks/cli" }
uuid = { workspace = true }
sha2 = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time"] }
subtle = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Registry", "Win32_Security"] }
